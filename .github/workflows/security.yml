name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  atlas-python315:
    name: Atlas pinned-source integration (Python 3.15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/global-medicines-atlas
          ref: 21f7721a8971ca6c9e704924503eebdd75356dce
          path: .local/atlas-python315-pin
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version-atlas
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Qualify the explicit Atlas Python 3.15 profile
        run: |
          python -m venv .venv-atlas
          .venv-atlas/bin/python -VV
          .venv-atlas/bin/python -c 'import pathlib,sys; assert sys.version_info[:3] == tuple(map(int,pathlib.Path(".python-version-atlas").read_text().strip().split("."))), sys.version'
          .venv-atlas/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-atlas.lock
          .venv-atlas/bin/python scripts/qualify_atlas_adapter.py --atlas-root .local/atlas-python315-pin --atlas-profile
  source-security:
    name: Shared source security
    uses: ./.github/workflows/careops-source-security-5cf006bce6c3.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 lacks $/ support; top-level local call uses this exact source revision
    with:
      policy-revision: 5cf006bce6c37c0c15db5d35055e302701a500ad
  portable-content:
    name: Portable content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Select and verify the repo-local Python runtime
        run: |
          python -m venv .venv
          .venv/bin/python -VV
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: .venv/bin/python scripts/check_portable_content.py
  tests:
    name: Portable toolkit tests (${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.15.1'
            node: '22'
          - python: '3.15.1'
            node: '26.12.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: tools/native-document-template/global.json
      - name: Select repo-local Python and restore locked document tooling
        run: |
          python -m venv .venv
          .venv/bin/python -VV
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
          (cd tools/native-document-template && dotnet restore --locked-mode)
      - run: .venv/bin/python scripts/run_portable_tests.py
      - run: .venv/bin/python scripts/build_submission_assembler.py
