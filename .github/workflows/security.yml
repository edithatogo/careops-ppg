name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-security:
    name: Shared source security
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@5cf006bce6c37c0c15db5d35055e302701a500ad
    with:
      policy-revision: 5cf006bce6c37c0c15db5d35055e302701a500ad
  portable-content:
    name: Portable content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Select and verify the repo-local Python runtime
        run: |
          python -m venv .venv
          .venv/bin/python -VV
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: .venv/bin/python scripts/check_portable_content.py
  tests:
    name: Portable toolkit tests (${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.15.1'
            node: '22'
          - python: '3.15.1'
            node: '26.12.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: tools/native-document-template/global.json
      - name: Select repo-local Python and restore locked document tooling
        run: |
          python -m venv .venv
          .venv/bin/python -VV
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
          (cd tools/native-document-template && dotnet restore --locked-mode)
      - run: .venv/bin/python scripts/run_portable_tests.py
      - run: .venv/bin/python scripts/build_submission_assembler.py
