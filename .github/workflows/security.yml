name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-security:
    name: Shared source security
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@f0e8db252b181955d31185f1ccdd1e77dee1f5f9
    with:
      policy-revision: f0e8db252b181955d31185f1ccdd1e77dee1f5f9
  portable-content:
    name: Portable content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_portable_content.py
  tests:
    name: Portable toolkit tests (${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            node: '22'
          - python: '3.15.0'
            node: '26.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_submission_assembler.cjs
      - run: node tests/test_metadata_prefill.cjs
      - run: node tests/test_cloud_package.cjs
      - run: python scripts/build_submission_assembler.py
